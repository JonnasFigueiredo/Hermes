name: Device farm E2E (BrowserStack)

# Runs the suite against real devices on BrowserStack App Automate.
# Requires repository secrets (Settings > Secrets and variables > Actions):
#   BROWSERSTACK_USERNAME, BROWSERSTACK_ACCESS_KEY
# The app is uploaded on every run and its bs:// id is passed as APP_PATH —
# the suite itself needs zero code changes (farm profile + env overrides).
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        type: choice
        default: smoke
        options:
          - all
          - smoke
          - regression
      device:
        description: 'BrowserStack device name'
        type: string
        default: 'Samsung Galaxy S23'
      os_version:
        description: 'Android version on the device'
        type: string
        default: '13.0'

jobs:
  e2e-farm:
    name: E2E on real device (${{ github.event.inputs.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUITE_FLAG: ${{ github.event.inputs.suite != 'all' && format('-Dgroups={0}', github.event.inputs.suite) || '' }}
      TIMEOUT_DEFAULT: '30'
      TIMEOUT_SHORT: '10'
    steps:
      - uses: actions/checkout@v4

      - name: Check farm credentials are configured
        env:
          BS_USER: ${{ secrets.BROWSERSTACK_USERNAME }}
        run: |
          if [ -z "$BS_USER" ]; then
            echo "::error::BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY secrets are not configured"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download app under test
        run: bash scripts/download-app.sh

      - name: Upload app to BrowserStack
        id: upload
        env:
          BS_USER: ${{ secrets.BROWSERSTACK_USERNAME }}
          BS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          APP_URL=$(curl -sf -u "$BS_USER:$BS_KEY" \
            -X POST https://api-cloud.browserstack.com/app-automate/upload \
            -F "file=@apps/Android-MyDemoAppRN.1.3.0.build-244.apk" | python3 -c 'import sys,json; print(json.load(sys.stdin)["app_url"])')
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Run suite on BrowserStack
        env:
          APPIUM_URL: https://${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }}@hub-cloud.browserstack.com/wd/hub
          APP_PATH: ${{ steps.upload.outputs.app_url }}
          DEVICE_NAME: ${{ github.event.inputs.device }}
        run: >
          mvn -B verify -Dhermes.env=farm $SUITE_FLAG
          "-Dcapability.appium:platformVersion=${{ github.event.inputs.os_version }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-reports
          path: |
            target/cucumber-report
            target/cucumber-html-reports
            target/allure-results
            target/screenshots
          if-no-files-found: ignore
