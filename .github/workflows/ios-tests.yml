name: iOS E2E

# Manual trigger (the macOS runner is slower and the WebDriverAgent build is heavy,
# so iOS is run on demand rather than on every push). Runs on a GitHub-hosted macOS
# runner (free for public repos), which ships Xcode and iPhone simulators.
on:
  workflow_dispatch:

jobs:
  e2e-ios:
    # Runs the smoke suite (including the full end-to-end checkout). The iOS simulator
    # is slow, so broader iOS regression coverage is tracked in ROADMAP.md as next work.
    name: E2E iOS Simulator
    runs-on: macos-15
    timeout-minutes: 50
    env:
      PLATFORM: ios
      DEVICE_NAME: iPhone 16
      TIMEOUT_DEFAULT: '30'
      TIMEOUT_SHORT: '10'
      SUITE_FLAG: -Dgroups=smoke
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Download app under test (iOS simulator build)
        run: bash scripts/download-app.sh ios

      - name: Resolve app path
        run: echo "APP_PATH=$(find apps -maxdepth 2 -name '*.app' -type d | head -1)" >> "$GITHUB_ENV"

      - name: Boot iOS simulator
        run: |
          xcrun simctl list devices available | head -30
          xcrun simctl boot "$DEVICE_NAME" || true
          xcrun simctl bootstatus "$DEVICE_NAME" -b || true

      - name: Start Appium server
        run: |
          nohup appium --log appium.log --log-level info &
          # macOS has no GNU `timeout`; poll with a bounded loop. Loading the xcuitest
          # driver on a cold runner can take well over a minute, so wait up to ~2.5 min.
          for i in $(seq 1 150); do
            curl -sf http://127.0.0.1:4723/status && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4723/status

      - name: Run E2E tests on iOS simulator
        # WebDriverAgent startup is occasionally flaky on hosted runners; retry once.
        run: mvn -B verify $SUITE_FLAG || mvn -B verify $SUITE_FLAG

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: target/allure-results
          if-no-files-found: ignore

      - name: Upload Cucumber HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-ios
          path: |
            target/cucumber-report
            target/cucumber-html-reports
          if-no-files-found: ignore

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-ios
          path: |
            target/screenshots
            appium.log
          if-no-files-found: ignore
