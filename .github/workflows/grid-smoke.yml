name: Grid smoke (docker-android)

# Validates the containerized device grid (docker/docker-compose.yml) on a
# GitHub-hosted ubuntu runner, which provides the KVM the grid requires.
# Manual trigger: this is an infrastructure check, not a code gate.
on:
  workflow_dispatch:

jobs:
  grid-smoke:
    name: Smoke suite against containerized device
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download app under test
        run: bash scripts/download-app.sh

      - name: Boot containerized device (Samsung Galaxy S10 profile)
        run: docker compose -f docker/docker-compose.yml up -d hermes-device-1

      - name: Wait for device to be healthy
        run: |
          timeout 600 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" hermes-device-1)" = "healthy" ]; do
            echo "device status: $(docker inspect -f "{{.State.Health.Status}}" hermes-device-1)"; sleep 15;
          done'
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:4723/status; do sleep 3; done'

      - name: Run smoke suite against the grid
        env:
          APP_PATH: /opt/hermes/apps/Android-MyDemoAppRN.1.3.0.build-244.apk
        run: mvn -B verify -Dhermes.env=grid -Dgroups=smoke

      - name: Collect container logs
        if: failure()
        run: docker logs hermes-device-1 > device.log 2>&1 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-smoke-reports
          path: |
            target/cucumber-report
            target/cucumber-html-reports
            target/allure-results
            target/screenshots
            device.log
          if-no-files-found: ignore

      - name: Tear down grid
        if: always()
        run: docker compose -f docker/docker-compose.yml down
